name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Node.js version required by IWSDK @1.0.1 engines field
  NODE_VERSION: "24"
  # Rust toolchain
  RUST_TOOLCHAIN: stable

jobs:
  # ------------------------------------------------------------------
  # Rust: formatting, native tests, and WASM compilation
  # ------------------------------------------------------------------
  rust:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32-unknown-unknown
          default: true
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        run: cargo test --workspace

      - name: Compile to WebAssembly
        run: cargo build --workspace --target wasm32-unknown-unknown

  # ------------------------------------------------------------------
  # TypeScript frontend: typecheck + production build
  # ------------------------------------------------------------------
  frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install client dependencies
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        working-directory: ./client
        run: pnpm run typecheck

      - name: Run frontend production build
        working-directory: ./client
        run: pnpm run build

  # ------------------------------------------------------------------
  # Note: Browser-based verification cannot be executed in this CI job
  # because it requires an XR-capable runtime / headless WebXR shim.
  # The M002 smoke test (WASM health check) is verified locally during
  # development and should be run in a browser environment before
  # submission.
  # ------------------------------------------------------------------
