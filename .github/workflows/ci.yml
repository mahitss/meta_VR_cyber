name: CI

on:
  push:
    branches: [main, fix/m002-ci-wasm-validation]
  pull_request:
    branches: [main]

env:
  # Node.js version required by IWSDK @1.0.1 engines field
  NODE_VERSION: "24"
  # Exact pnpm version used for development and CI
  PNPM_VERSION: "12.18.0"
  # Rust toolchain
  RUST_TOOLCHAIN: "stable"

jobs:
  # ------------------------------------------------------------------
  # Rust: formatting, native tests, and WASM compilation
  # ------------------------------------------------------------------
  rust:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        run: cargo test --workspace

      - name: Compile to WebAssembly
        run: cargo build --workspace --target wasm32-unknown-unknown

  # ------------------------------------------------------------------
  # TypeScript frontend: typecheck + production build
  # ------------------------------------------------------------------
  frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install pnpm first so setup-node can cache the pnpm store.
      - name: Install pnpm via pnpm/action-setup
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install client dependencies
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        working-directory: ./client
        run: pnpm run typecheck

      - name: Run frontend production build
        working-directory: ./client
        run: pnpm run build
